name: 獲取新聞並發送至 Cloudflare D1
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

jobs:
  fetch-and-send:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch RSS and POST to Cloudflare Worker
        env:
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import time
          from urllib.parse import urlencode, quote
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError, URLError
          import xml.etree.ElementTree as ET

          categories = [
              ("時事", "國際 OR 世界"),
              ("科技動態", "科技"),
              ("焦點新聞", "熱門新聞"),
              ("金融", "金融 OR 財經"),
          ]

          def fetch_url(url, timeout=20):
              try:
                  req = Request(url, headers={"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"})
                  with urlopen(req, timeout=timeout) as resp:
                      return resp.read().decode("utf-8", errors="ignore")
              except Exception as e:
                  print(f"fetch_url error: {e}")
                  return ""

          def get_items(cat_name, query):
              # 改为 Bing 优先，因为 Bing 的 link 直接指向原文
              urls = [
                  "https://www.bing.com/news/search?" + urlencode({"q": query, "format": "rss"}),
                  "https://news.google.com/rss/search?" + urlencode({"q": query, "hl": "zh-TW", "gl": "TW", "ceid": "TW:zh-Hant"}),
              ]
              for url in urls:
                  try:
                      req = Request(url, headers={"User-Agent": "Mozilla/5.0"})
                      with urlopen(req, timeout=15) as response:
                          content = response.read()
                          if content.strip().startswith(b"<!DOCTYPE") or content.strip().startswith(b"<html"):
                              continue
                          root = ET.fromstring(content)
                          items = []
                          for item in root.findall("./channel/item")[:8]:
                              title = (item.findtext("title") or "").strip()
                              link = (item.findtext("link") or "").strip()
                              source_el = item.find("source")
                              source = source_el.text.strip() if source_el is not None and source_el.text else "網絡新聞"
                              description = (item.findtext("description") or "").strip()
                              content_encoded = item.findtext("{http://purl.org/rss/1.0/modules/content/}encoded") or ""
                              body = content_encoded or description or title
                              if title and link:
                                  items.append({
                                      "title": title,
                                      "link": link,
                                      "source": source,
                                      "category": cat_name,
                                      "content": body
                                  })
                          if items:
                              print(f"✅ {cat_name}: 从 {url} 获取到 {len(items)} 篇")
                              return items
                  except Exception as e:
                      print(f"❌ {cat_name}: {url} 抓取失败: {e}")
                      continue
              return []

          def fetch_full_text(item):
              link = item["link"]
              original = link
              # 如果是 Google News 链接，尝试提取真实 URL（通常无效，所以优先用 Bing）
              if "news.google.com" in link:
                  try:
                      from urllib.parse import urlparse, parse_qs
                      parsed = urlparse(link)
                      qs = parse_qs(parsed.query)
                      if "url" in qs:
                          original = qs["url"][0]
                  except:
                      pass
              # 使用 Jina Reader 抓取
              jina_url = "https://r.jina.ai/" + quote(original, safe="")
              text = fetch_url(jina_url, timeout=20)
              if text and len(text) > 200:
                  print(f"✅ 抓到正文: {item['title'][:30]}... 长度={len(text)}")
                  return text[:4000]
              else:
                  print(f"❌ 抓取失败: {item['title'][:30]}... 返回长度={len(text)}")
                  return ""

          all_articles = []
          for cat_name, query in categories:
              items = get_items(cat_name, query)
              for item in items:
                  full = fetch_full_text(item)
                  if full:
                      item["content"] = full
                  all_articles.append(item)
                  time.sleep(0.5)
              time.sleep(1)

          # 统计
          good = sum(1 for a in all_articles if len(a.get("content","")) > 200)
          print(f"📊 总共 {len(all_articles)} 篇，其中正文有效 {good} 篇")

          if not all_articles:
              print("❌ 错误：未抓取到任何新闻，流程终止。")
              sys.exit(1)

          worker_url = "https://sylogs-news-fetcher.hjlaochi-27c.workers.dev/ingest"
          secret = os.environ.get("INGEST_SECRET", "").strip()
          if not secret:
              print("❌ 错误：GitHub Secret [INGEST_SECRET] 为空！请先去 Settings 配置。")
              sys.exit(1)

          payload = json.dumps({"articles": all_articles}).encode("utf-8")
          req = Request(
              worker_url,
              data=payload,
              method="POST",
              headers={
                  "Content-Type": "application/json",
                  "Authorization": secret,
                  "x-admin-key": secret,
                  "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64)",
              },
          )
          try:
              with urlopen(req, timeout=30) as resp:
                  res_text = resp.read().decode("utf-8")
                  print(f"✅ 發送成功 [{worker_url}]:", res_text)
          except HTTPError as e:
              err_body = e.read().decode("utf-8", errors="ignore")
              print(f"❌ HTTP 请求失败！状态码: {e.code}, 原因: {e.reason}")
              print(f"服务器返回信息: {err_body}")
              sys.exit(1)
          except URLError as e:
              print(f"❌ 网络链接失败: {e.reason}")
              sys.exit(1)
          except Exception as e:
              print(f"❌ 未知错误: {e}")
              sys.exit(1)
          PY
