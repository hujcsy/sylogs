name: 獲取新聞並發送至 Cloudflare D1
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

jobs:
  fetch-and-send:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch RSS and POST to Cloudflare Worker
        env:
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen
          import xml.etree.ElementTree as ET

          categories = [
              ("時事", "國際 OR 世界"),
              ("科技動態", "科技"),
              ("焦點新聞", "熱門新聞"),
              ("金融", "金融 OR 財經"),
          ]

          def get_items(cat_name, query):
              urls = [
                  "https://news.google.com/rss/search?" + urlencode({"q": query, "hl": "zh-TW", "gl": "TW", "ceid": "TW:zh-Hant"}),
                  "https://www.bing.com/news/search?" + urlencode({"q": query, "format": "rss"})
              ]
              headers = {
                  "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64)",
                  "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8"
              }

              for url in urls:
                  try:
                      req = Request(url, headers=headers)
                      with urlopen(req, timeout=15) as response:
                          content = response.read()
                          if content.strip().startswith(b"<!DOCTYPE") or content.strip().startswith(b"<html"):
                              continue
                          
                          root = ET.fromstring(content)
                          items = []
                          for item in root.findall("./channel/item")[:8]:
                              title = (item.findtext("title") or "").strip()
                              link = (item.findtext("link") or "").strip()
                              source_el = item.find("source")
                              source = source_el.text.strip() if source_el is not None and source_el.text else "網絡新聞"
                              if title and link:
                                  items.append({
                                      "title": title,
                                      "link": link,
                                      "source": source,
                                      "category": cat_name
                                  })
                          if items:
                              return items
                  except Exception as e:
                      continue
              return []

          all_articles = []
          for cat_name, query in categories:
              all_articles.extend(get_items(cat_name, query))
              time.sleep(1)

          worker_url = "https://sylogs-news-fetcher.hjlaochi-27c.workers.dev/ingest"
          secret = os.environ.get("INGEST_SECRET")
          
          payload = json.dumps({"articles": all_articles}).encode("utf-8")

          req = Request(
              worker_url,
              data=payload,
              method="POST",
              headers={
                  "Content-Type": "application/json",
                  "Authorization": f"Bearer {secret}",
                  "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64)",
              },
          )
          try:
              with urlopen(req, timeout=30) as resp:
                  res_text = resp.read().decode("utf-8")
                  print(f"發送成功 [{worker_url}]:", res_text)
          except Exception as e:
              print(f"發送失敗: {e}")
          PY
