name: 獲取新聞並發送至 Cloudflare D1
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

jobs:
  fetch-and-send:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch RSS and POST to Cloudflare Worker
        env:
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
        run: |
          pip install deep-translator --quiet
          python - <<'PY'
          import json
          import os
          import sys
          import time
          import re
          import html as html_lib
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError, URLError
          import xml.etree.ElementTree as ET
          from deep_translator import GoogleTranslator, MyMemoryTranslator

          categories = [
              ("時事", "world news"),
              ("科技動態", "technology"),
              ("焦點新聞", "top stories"),
              ("金融", "finance"),
          ]

          def clean_html(raw):
              if not raw:
                  return ""
              raw = re.sub(r'<(script|style)[^>]*>.*?</\1>', ' ', raw, flags=re.DOTALL|re.IGNORECASE)
              raw = re.sub(r'<[^>]+>', ' ', raw)
              raw = html_lib.unescape(raw)
              raw = re.sub(r'\s+', ' ', raw).strip()
              return raw

          def fetch_rss(url):
              try:
                  req = Request(url, headers={"User-Agent": "Mozilla/5.0"})
                  with urlopen(req, timeout=15) as resp:
                      content = resp.read()
                      root = ET.fromstring(content)
                      items = []
                      for item in root.findall("./channel/item")[:10]:
                          title = (item.findtext("title") or "").strip()
                          link = (item.findtext("link") or "").strip()
                          source_el = item.find("source")
                          source = source_el.text.strip() if source_el is not None and source_el.text else "International News"
                          description = (item.findtext("description") or "").strip()
                          content_encoded = item.findtext("{http://purl.org/rss/1.0/modules/content/}encoded") or ""
                          raw_body = content_encoded or description
                          body_clean = clean_html(raw_body)
                          if title and link:
                              items.append({
                                  "title": title,
                                  "link": link,
                                  "source": source,
                                  "category": cat_name,
                                  "content": body_clean
                              })
                      return items
              except Exception:
                  return []

          def get_items(cat_name, query):
              bing_url = "https://www.bing.com/news/search?" + urlencode({
                  "q": query,
                  "format": "rss",
                  "mkt": "en-US"
              })
              items = fetch_rss(bing_url)
              if items:
                  print(f"✅ {cat_name}: Bing 获取到 {len(items)} 篇")
                  return items
              google_url = "https://news.google.com/rss/search?" + urlencode({
                  "q": query,
                  "hl": "en-US",
                  "gl": "US",
                  "ceid": "US:en"
              })
              items = fetch_rss(google_url)
              print(f"✅ {cat_name}: Google 获取到 {len(items)} 篇")
              return items

          def translate_text(text, target_lang="zh-TW"):
              if not text or len(text) < 10:
                  return text
              # 限制翻译长度，避免超时
              text = text[:1000]
              try:
                  # 优先 Google 翻译
                  translator = GoogleTranslator(source="auto", target="zh-TW")
                  result = translator.translate(text)
                  if result and len(result) > 5:
                      return result
              except Exception as e:
                  print(f"Google 翻译失败: {e}")
              try:
                  # 回退 MyMemory 翻译（免费无需 key）
                  translator = MyMemoryTranslator(source="en", target="zh-TW")
                  result = translator.translate(text)
                  if result and len(result) > 5:
                      return result
              except Exception as e:
                  print(f"MyMemory 翻译失败: {e}")
              # 翻译失败保留原文
              return text

          all_articles = []
          for cat_name, query in categories:
              items = get_items(cat_name, query)
              for item in items:
                  # 翻译标题和正文
                  translated_title = translate_text(item["title"])
                  translated_content = translate_text(item["content"])
                  item["title"] = translated_title
                  item["content"] = translated_content
                  all_articles.append(item)
                  time.sleep(0.5)  # 避免请求过快
              time.sleep(1)

          good = len(all_articles)
          print(f"📊 有效文章 {good} 篇")

          if not all_articles:
              print("❌ 没有有效文章")
              sys.exit(1)

          worker_url = "https://sylogs-news-fetcher.hjlaochi-27c.workers.dev/ingest"
          secret = os.environ.get("INGEST_SECRET", "").strip()
          if not secret:
              print("❌ 缺少 INGEST_SECRET")
              sys.exit(1)

          payload = json.dumps({"articles": all_articles}).encode("utf-8")
          req = Request(
              worker_url,
              data=payload,
              method="POST",
              headers={
                  "Content-Type": "application/json",
                  "Authorization": secret,
                  "x-admin-key": secret,
                  "User-Agent": "Mozilla/5.0",
              },
          )
          try:
              with urlopen(req, timeout=30) as resp:
                  res_text = resp.read().decode("utf-8")
                  print(f"✅ 發送成功: {res_text}")
          except HTTPError as e:
              print(f"❌ HTTP 错误: {e.code} {e.reason}")
              sys.exit(1)
          except URLError as e:
              print(f"❌ 网络错误: {e.reason}")
              sys.exit(1)
          PY
