name: 獲取新聞並發送至 Cloudflare D1
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

jobs:
  fetch-and-send:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch RSS, AI Optimize and POST to Cloudflare Worker
        env:
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen
          import xml.etree.ElementTree as ET

          categories = [
              ("時事", "國際 OR 世界"),
              ("科技動態", "科技"),
              ("焦點新聞", "熱門新聞"),
              ("金融", "金融 OR 財經"),
          ]

          def ai_optimize_article(title):
              api_key = os.environ.get("TOGETHER_API_KEY")
              if not api_key:
                  return title, ""

              url = "https://api.together.xyz/v1/chat/completions"
              headers = {
                  "Authorization": f"Bearer {api_key}",
                  "Content-Type": "application/json",
                  "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"
              }
              payload = json.dumps({
                  "model": "deepseek-ai/DeepSeek-V3",
                  "messages": [
                      {
                          "role": "system",
                          "content": "你是一個專業的新聞網站主編。請根據提供的新聞原始標題，完成兩件事：1. 潤飾標題；2. 撰寫摘要。請嚴格返回 JSON 格式：{\"title\": \"...\", \"summary\": \"...\"}"
                      },
                      {
                          "role": "user",
                          "content": f"原始新聞標題: {title}"
                      }
                  ],
                  "response_format": {"type": "json_object"}
              }).encode("utf-8")

              try:
                  req = Request(url, data=payload, headers=headers, method="POST")
                  with urlopen(req, timeout=30) as resp:
                      res_json = json.loads(resp.read().decode("utf-8"))
                      content = res_json['choices'][0]['message']['content']
                      data = json.loads(content)
                      return data.get("title", title), data.get("summary", "")
              except Exception as e:
                  print(f"AI 優化失敗 ({title[:10]}...): {e}")
                  return title, ""

          def get_items(cat_name, query):
              url = "https://news.google.com/rss/search?" + urlencode({
                  "q": query,
                  "hl": "zh-TW",
                  "gl": "TW",
                  "ceid": "TW:zh-Hant"
              })
              # 加上真正的 Browser User-Agent 避免 Google 返回 403/HTML
              req = Request(url, headers={
                  "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
              })
              try:
                  with urlopen(req, timeout=30) as response:
                      content = response.read()
                      # 檢查是否拿到 HTML 避開 syntax error
                      if content.strip().startswith(b"<!DOCTYPE") or content.strip().startswith(b"<html"):
                          print(f"[{cat_name}] 抓取失敗: 收到 HTML 網頁而非 RSS XML")
                          return []
                      
                      root = ET.fromstring(content)
                      items = []
                      for item in root.findall("./channel/item")[:8]:
                          title = (item.findtext("title") or "").strip()
                          link = (item.findtext("link") or "").strip()
                          source_el = item.find("source")
                          source = source_el.text.strip() if source_el is not None and source_el.text else ""
                          if title and link:
                              opt_title, summary = ai_optimize_article(title)
                              items.append({
                                  "title": opt_title,
                                  "link": link,
                                  "source": source,
                                  "summary": summary
                              })
                      return items
              except Exception as e:
                  print(f"[{cat_name}] 抓取失敗: {e}")
                  return []

          all_news = {}
          for cat_name, query in categories:
              all_news[cat_name] = get_items(cat_name, query)

          worker_url = "https://syslogs-news-ingest.sylogs.workers.dev"
          secret = os.environ.get("INGEST_SECRET")

          payload = json.dumps(all_news).encode("utf-8")
          req = Request(
              worker_url,
              data=payload,
              method="POST",
              headers={
                  "Content-Type": "application/json",
                  "Authorization": f"Bearer {secret}",
                  "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64)",
              },
          )
          try:
              with urlopen(req, timeout=120) as resp:
                  res_text = resp.read().decode("utf-8")
                  print("回應:", res_text)
          except Exception as e:
              print(f"發送至 Worker 失敗: {e}")
          PY
