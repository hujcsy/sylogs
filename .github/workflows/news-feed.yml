name: 獲取新聞並發送至 Cloudflare D1（官方RSS源 v3）

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

jobs:
  fetch-and-send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code (if needed)
        uses: actions/checkout@v3

      - name: Fetch RSS, extract full article, POST to Cloudflare Worker
        env:
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
        run: |
          pip install deep-translator beautifulsoup4 --quiet
          python - <<'PY'
          import json
          import os
          import sys
          import time
          import re
          import html as html_lib
          from urllib.request import Request, urlopen, build_opener, HTTPRedirectHandler
          from urllib.error import HTTPError, URLError
          import xml.etree.ElementTree as ET
          from bs4 import BeautifulSoup
          from deep_translator import GoogleTranslator, MyMemoryTranslator

          # ===== v3：改用官方媒体 RSS 源（Bing News RSS 已失效，返回 HTML 而非 RSS）=====
          # 每个分类配 1~2 个稳定官方源，链接真实可直接抓正文
          categories = [
              ("時事", [
                  "https://feeds.bbci.co.uk/news/world/rss.xml",
                  "https://www.theguardian.com/world/rss",
              ]),
              ("科技動態", [
                  "https://techcrunch.com/feed/",
                  "https://rss.nytimes.com/services/xml/rss/nyt/Technology.xml",
              ]),
              ("焦點新聞", [
                  "http://rss.cnn.com/rss/cnn_topstories.rss",
                  "https://feeds.npr.org/1001/rss.xml",
              ]),
              ("金融", [
                  "https://www.cnbc.com/id/100003114/device/rss/rss.html",
                  "http://feeds.marketwatch.com/marketwatch/topstories/",
              ]),
              ("奇聞異事", [
                  "https://www.upi.com/rss/odd/",
              ]),
          ]

          class RedirectHandler(HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  newurl = newurl.replace(" ", "%20")
                  return super().redirect_request(req, fp, code, msg, headers, newurl)

          opener = build_opener(RedirectHandler)

          # 垃圾文本特征（错误页 / 反爬提示）
          JUNK_PATTERNS = [
              r"error\s*500",
              r"that's an error",
              r"please try again later",
              r"server error",
              r"the requested url was rejected",
              r"access denied",
              r"attention required",
              r"robot check",
              r"captcha",
              r"blocked",
          ]
          JUNK_RE = re.compile("|".join(JUNK_PATTERNS), re.I)

          # ===== 奇聞異事內容分流（v3.1 新增）=====
          # 背景：UPI odd 源混雜大量名人/娛樂/訃聞/生日專欄，若整源歸入「奇聞異事」，
          # 會把本應屬「時事」的新聞錯置（例如藝術家過世、名人軼事）。
          # 此處按標題信號分流：
          #   1) 純 trivia 專欄（famous birthdays / almanac 等）→ 直接丟棄
          #   2) 名人/訃聞類新聞 → 改歸「時事」
          #   3) 其餘保持「奇聞異事」
          TRIVIA_RE = re.compile(r"famous birthday|birthdays|almanac|on this day|today in history|quote of the day|trivia", re.I)
          CELEB_DEATH_RE = re.compile(r"dies at|dies$|died|dead at|death|obituary|remembering|tribute|funeral|survived by", re.I)
          CELEB_FIGURE_RE = re.compile(r"celebrity|famous|movie star|tv star|actor|actress|singer|artist|painter|musician|filmmaker|director|author|model", re.I)

          def is_junk(text):
              if not text:
                  return True
              return bool(JUNK_RE.search(text))

          def clean_text(text):
              if not text:
                  return ""
              text = html_lib.unescape(text)
              text = re.sub(r'\s+', ' ', text).strip()
              return text

          def fetch_url(url, timeout=15):
              req = Request(url, headers={
                  "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36",
                  "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
                  "Accept-Language": "en-US,en;q=0.5",
              })
              with opener.open(req, timeout=timeout) as resp:
                  return resp.read().decode("utf-8", errors="ignore")

          def extract_main_text_bs(html_content):
              if not html_content:
                  return ""
              if JUNK_RE.search(html_content):
                  return ""
              soup = BeautifulSoup(html_content, 'html.parser')
              for element in soup(["script", "style", "nav", "footer", "header", "aside", "form", "iframe", "noscript"]):
                  element.decompose()

              candidates = soup.find_all(['article', 'div'], class_=re.compile(r'article|story|post|content|text|body', re.I))
              best_text = ""
              for cand in candidates:
                  p_tags = cand.find_all('p')
                  text = " ".join([p.get_text() for p in p_tags])
                  if len(text) > len(best_text):
                      best_text = text

              if len(best_text) < 200:
                  p_tags = soup.find_all('p')
                  text = " ".join([p.get_text() for p in p_tags])
                  if len(text) > len(best_text):
                      best_text = text

              return clean_text(best_text)

          def fetch_full_article(link):
              try:
                  html = fetch_url(link)
                  return extract_main_text_bs(html)[:3000]
              except Exception:
                  return ""

          def fetch_rss(url, cat_name):
              try:
                  content = fetch_url(url)
                  root = ET.fromstring(content)
                  items = []
                  for item in root.findall("./channel/item")[:6]:
                      title = (item.findtext("title") or "").strip()
                      link = (item.findtext("link") or "").strip()
                      source_el = item.find("source")
                      source = source_el.text.strip() if source_el is not None and source_el.text else "News"
                      description = (item.findtext("description") or "").strip()
                      desc_clean = clean_text(re.sub(r'<[^>]+>', ' ', description))
                      if title and link and not is_junk(title) and not is_junk(desc_clean):
                          items.append({
                              "title": title, "link": link, "source": source,
                              "category": cat_name, "content": desc_clean,
                          })
                  return items
              except Exception:
                  return []

          def translate_text(text, target_lang="zh-TW"):
              if not text or len(text) < 2: return text
              try:
                  return GoogleTranslator(source="auto", target=target_lang).translate(text[:1500])
              except:
                  try:
                      return MyMemoryTranslator(source="en", target=target_lang).translate(text[:1500])
                  except:
                      return text

          all_articles = []
          seen_links = set()
          print("🔄 開始獲取新聞（官方RSS源）...")

          for cat_name, feeds in categories:
              for feed in feeds:
                  try:
                      items = fetch_rss(feed, cat_name)
                      print(f"📡 {cat_name} @ {feed.split('/')[2]}: {len(items)} 條")
                      for item in items:
                          # 奇聞異事內容分流：trivia 專欄丟棄；名人/訃聞改歸「時事」
                          if cat_name == "奇聞異事":
                              if TRIVIA_RE.search(item["title"]):
                                  print(f"⏭️ 丟棄 trivia 專欄: {item['title'][:30]}")
                                  continue
                              if CELEB_DEATH_RE.search(item["title"]) and CELEB_FIGURE_RE.search(item["title"]):
                                  item["category"] = "時事"
                                  print(f"↩️ 名人訃聞改歸時事: {item['title'][:30]}")
                          if item["link"] not in seen_links:
                              print(f"🌐 正在解析: {item['title'][:20]}...")
                              full = fetch_full_article(item["link"])
                              if len(full) > 50:
                                  item["content"] = full

                              clean_len = len(item["content"].replace("\n", " ").strip())
                              if clean_len < 200 or is_junk(item["content"]):
                                  print(f"⏭️ 跳過 (正文無效, len={clean_len}): {item['title'][:30]}")
                                  continue

                              item["title"] = translate_text(item["title"])
                              item["content"] = translate_text(item["content"])
                              if is_junk(item["title"]) or len(item["content"]) < 80:
                                  continue
                              all_articles.append(item)
                              seen_links.add(item["link"])
                              time.sleep(0.5)
                  except Exception as e:
                      print(f"⚠️ {cat_name} @ {feed.split('/')[2]} 出錯: {e}")

          if not all_articles:
              print("❌ 沒有有效文章")
              sys.exit(1)

          print(f"✅ 共收集 {len(all_articles)} 篇有效文章，開始發送...")

          worker_url = "https://sylogs-news-fetcher.hjlaochi-27c.workers.dev/ingest"
          secret = os.environ.get("INGEST_SECRET", "").strip()

          for i in range(0, len(all_articles), 5):
              batch = all_articles[i:i+5]
              payload = json.dumps({"articles": batch}).encode("utf-8")
              req = Request(worker_url, data=payload, method="POST", headers={
                  "Content-Type": "application/json",
                  "Authorization": secret,
                  "x-admin-key": secret,
                  "User-Agent": "Mozilla/5.0",
              })
              try:
                  with urlopen(req, timeout=30) as resp:
                      print(f"✅ 第 {i//5 + 1} 批次發送成功")
              except Exception as e:
                  print(f"❌ 發送失敗: {e}")
          PY
