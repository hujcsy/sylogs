name: 獲取新聞並發送至 Cloudflare D1
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

jobs:
  fetch-and-send:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch RSS and POST to Cloudflare Worker
        env:
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import time
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError, URLError
          import xml.etree.ElementTree as ET

          categories = [
              ("時事", "國際 OR 世界"),
              ("科技動態", "科技"),
              ("焦點新聞", "熱門新聞"),
              ("金融", "金融 OR 財經"),
          ]

          def get_items(cat_name, query):
              urls = [
                  "https://news.google.com/rss/search?" + urlencode({"q": query, "hl": "zh-TW", "gl": "TW", "ceid": "TW:zh-Hant"}),
                  "https://www.bing.com/news/search?" + urlencode({"q": query, "format": "rss"})
              ]
              headers = {
                  "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64)",
                  "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8"
              }

              for url in urls:
                  try:
                      req = Request(url, headers=headers)
                      with urlopen(req, timeout=15) as response:
                          content = response.read()
                          if content.strip().startswith(b"<!DOCTYPE") or content.strip().startswith(b"<html"):
                              continue
                          
                          root = ET.fromstring(content)
                          items = []
                          for item in root.findall("./channel/item")[:8]:
                              title = (item.findtext("title") or "").strip()
                              link = (item.findtext("link") or "").strip()
                              source_el = item.find("source")
                              source = source_el.text.strip() if source_el is not None and source_el.text else "網絡新聞"
                              # === 新增：提取描述/正文 ===
                              description = (item.findtext("description") or "").strip()
                              # 有些 RSS 用 content:encoded 存放正文
                              content_encoded = item.findtext("{http://purl.org/rss/1.0/modules/content/}encoded") or ""
                              body = content_encoded or description
                              if not body:
                                  body = title  # 如果都没有，用标题兜底，至少不为空
                              # ========================
                              if title and link:
                                  items.append({
                                      "title": title,
                                      "link": link,
                                      "source": source,
                                      "category": cat_name,
                                      "content": body   # 新增字段
                                  })
                          if items:
                              return items
                  except Exception as e:
                      continue
              return []

          all_articles = []
          for cat_name, query in categories:
              all_articles.extend(get_items(cat_name, query))
              time.sleep(1)

          if not all_articles:
              print("❌ 错误：未抓取到任何新闻，流程终止。")
              sys.exit(1)

          worker_url = "https://sylogs-news-fetcher.hjlaochi-27c.workers.dev/ingest"
          secret = os.environ.get("INGEST_SECRET", "").strip()

          if not secret:
              print("❌ 错误：GitHub Secret [INGEST_SECRET] 为空！请先去 Settings 配置。")
              sys.exit(1)

          payload = json.dumps({"articles": all_articles}).encode("utf-8")

          # 同时传入 Authorization 和 x-admin-key 确保后端能识别
          req = Request(
              worker_url,
              data=payload,
              method="POST",
              headers={
                  "Content-Type": "application/json",
                  "Authorization": secret,
                  "x-admin-key": secret,
                  "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64)",
              },
          )
          try:
              with urlopen(req, timeout=30) as resp:
                  res_text = resp.read().decode("utf-8")
                  print(f"✅ 發送成功 [{worker_url}]:", res_text)
          except HTTPError as e:
              err_body = e.read().decode("utf-8", errors="ignore")
              print(f"❌ HTTP 请求失败！状态码: {e.code}, 原因: {e.reason}")
              print(f"服务器返回信息: {err_body}")
              sys.exit(1)
          except URLError as e:
              print(f"❌ 网络链接失败: {e.reason}")
              sys.exit(1)
          except Exception as e:
              print(f"❌ 未知错误: {e}")
              sys.exit(1)
          PY
