export default {
  async fetch(request, env, ctx) {
    const url = new URL(request.url);

    if (request.method === "POST" && url.pathname === "/ingest") {
      return await handleIngest(request, env, ctx);
    }

    if (request.method === "GET" && url.pathname === "/process-pending") {
      const auth = request.headers.get("Authorization") || "";
      const cleanAuth = auth.replace(/^Bearer\s+/i, "").trim();
      const expected = (env.INGEST_SECRET || "").trim();
      if (!cleanAuth || cleanAuth !== expected) {
        return new Response("Unauthorized", { status: 401 });
      }
      const processed = await processPendingArticles(env, 5);
      return new Response(JSON.stringify({ processed }, null, 2), {
        headers: { "Content-Type": "application/json; charset=utf-8" },
      });
    }

    return new Response("Not Found", { status: 404 });
  },

  async scheduled(event, env, ctx) {
    ctx.waitUntil(processPendingArticles(env, 3));
  },
};

async function handleIngest(request, env, ctx) {
  const auth = request.headers.get("Authorization") || "";
  const cleanAuth = auth.replace(/^Bearer\s+/i, "").trim();
  const expected = (env.INGEST_SECRET || "").trim();
  if (!cleanAuth || cleanAuth !== expected) {
    return new Response("Unauthorized", { status: 401 });
  }

  let body;
  try {
    body = await request.json();
  } catch (e) {
    return new Response("Invalid JSON", { status: 400 });
  }

  const articles = Array.isArray(body.articles) ? body.articles : [];
  let inserted = 0;

  for (const a of articles) {
    if (!a.title || !a.link) continue;
    try {
      const result = await env.DB.prepare(
        "INSERT OR IGNORE INTO pending_articles (title, content, link, source, category) VALUES (?, ?, ?, ?, ?)"
      ).bind(
        a.title,
        a.content || a.description || a.content_encoded || a.summary || null,
        a.link,
        a.source || "",
        a.category || ""
      ).run();
      if (result.meta && result.meta.changes > 0) inserted++;
    } catch (e) {
      // 单笔失败不影响其他
    }
  }

  ctx.waitUntil(processPendingArticles(env, 5));

  return new Response(
    JSON.stringify({ ok: true, received: articles.length, inserted }),
    { headers: { "Content-Type": "application/json; charset=utf-8" } }
  );
}

function extractTextFromHtml(html) {
  if (!html) return "";
  return html
    .replace(/<script[\s\S]*?<\/script>/gi, " ")
    .replace(/<style[\s\S]*?<\/style>/gi, " ")
    .replace(/<[^>]+>/g, " ")
    .replace(/&nbsp;/g, " ")
    .replace(/&amp;/g, "&")
    .replace(/&lt;/g, "<")
    .replace(/&gt;/g, ">")
    .replace(/&quot;/g, '"')
    .replace(/\s+/g, " ")
    .trim();
}

function extractOriginalUrlFromGoogleNews(link) {
  try {
    const url = new URL(link);
    const target = url.searchParams.get("url");
    if (target) return target;
  } catch (e) {}
  return link;
}

async function fetchWithTimeout(url, timeoutMs = 20000) {
  try {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), timeoutMs);
    const resp = await fetch(url, {
      headers: {
        "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36",
        "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,*/*;q=0.8",
        "Accept-Language": "zh-TW,zh;q=0.9,en;q=0.8",
      },
      redirect: "follow",
    });
    clearTimeout(timer);
    return resp;
  } catch (e) {
    return null;
  }
}

async function tryFetchArticleText(link) {
  // 1. 提取原始 URL
  const originalUrl = extractOriginalUrlFromGoogleNews(link);

  // 2. 尝试直接抓取原始 URL
  const resp = await fetchWithTimeout(originalUrl, 15000);
  if (resp && resp.ok) {
    try {
      const html = await resp.text();
      const text = extractTextFromHtml(html);
      if (text && text.length > 200) {
        return text.slice(0, 4000);
      }
    } catch (e) {}
  }

  // 3. 回退：使用 Jina Reader 抓取（支持 Google News 链接）
  try {
    const jinaUrl = `https://r.jina.ai/${encodeURIComponent(originalUrl)}`;
    const jinaResp = await fetch(jinaUrl, {
      headers: {
        "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36",
      },
    });
    if (jinaResp.ok) {
      const jinaText = await jinaResp.text();
      if (jinaText && jinaText.length > 200) {
        return jinaText.slice(0, 4000);
      }
    }
  } catch (e) {}

  return "";
}

async function generateSummary(env, title, source, articleText) {
  // 只有正文足够长才生成摘要，否则返回空（但这种情况会被过滤掉）
  if (!articleText || articleText.length < 200) return "";

  const prompt = `你是新聞編輯。請根據以下新聞全文,用繁體中文寫一段80-120字的精簡摘要,只輸出摘要本身,不要加任何說明或標題:\n\n標題:${title}\n來源:${source}\n內文:${articleText}`;

  try {
    const aiResp = await env.AI.run("@cf/zai-org/glm-4.7-flash", {
      messages: [{ role: "user", content: prompt }],
      max_tokens: 500,
    });
    const result = extractAiText(aiResp);
    if (result && result.trim()) return result.trim();
  } catch (e) {}

  // AI 失败或没有结果时，用正文前 150 字兜底
  return articleText.slice(0, 150);
}

function extractAiText(aiResp) {
  if (!aiResp) return "";
  if (typeof aiResp.response === "string" && aiResp.response.trim()) return aiResp.response.trim();
  const msg = aiResp.choices && aiResp.choices[0] && aiResp.choices[0].message;
  if (msg && typeof msg.content === "string" && msg.content.trim()) return msg.content.trim();
  return "";
}

async function generateInsight(env, title, category, summary) {
  const prompt = `你是一位深度觀察者,請針對以下新聞撰寫一段約200字的獨家評論。要求:
1. 從該事件對產業/金融/財富的影響角度切入
2. 必須包含「我認為」或「從我的視角來看」這類第一人稱表達
3. 若該新聞適合,結尾可加1則簡短、切實可行的避坑或行動建議(1-2句即可,不適合的話不用勉強加)
4. 只輸出評論本身,不要標題、不要markdown符號、不要任何說明文字
5. 若資訊不足以做出有意義的產業/金融分析(例如純運動賽果、娛樂八卦、生活資訊),直接輸出「SKIP」四個字,不要硬寫評論

分類:${category}
標題:${title}
摘要:${summary}`;

  try {
    const aiResp = await env.AI.run("@cf/zai-org/glm-4.7-flash", {
      messages: [{ role: "user", content: prompt }],
      max_tokens: 600,
    });
    const result = extractAiText(aiResp);
    if (!result || !result.trim() || result.trim() === "SKIP" || result.includes("SKIP")) return "";
    return result.trim();
  } catch (e) {
    return "";
  }
}

async function processPendingArticles(env, limit) {
  const { results } = await env.DB.prepare(
    "SELECT id, title, content, link, source, category FROM pending_articles ORDER BY id ASC LIMIT ?"
  ).bind(limit).all();

  const MIN_CONTENT_LENGTH = 200;
  let processed = 0;

  for (const row of results) {
    try {
      let articleText = "";

      // 先看 RSS 自带的 content 是否足够长（清洗后）
      if (row.content) {
        const cleaned = extractTextFromHtml(row.content);
        if (cleaned && cleaned.length >= MIN_CONTENT_LENGTH) {
          articleText = cleaned;
        }
      }

      // 不够长则尝试抓取原文
      if (!articleText) {
        articleText = await tryFetchArticleText(row.link);
      }

      // 最终正文仍不达标：直接丢弃
      if (!articleText || articleText.length < MIN_CONTENT_LENGTH) {
        await env.DB.prepare("DELETE FROM pending_articles WHERE id = ?").bind(row.id).run();
        continue;
      }

      const summary = await generateSummary(env, row.title, row.source, articleText);
      const insight = await generateInsight(env, row.title, row.category, summary);

      await env.DB.prepare(
        "INSERT OR IGNORE INTO articles (title, content, summary, link, source, category, published_at, editor_comment) VALUES (?, ?, ?, ?, ?, ?, ?, ?)"
      ).bind(
        row.title,
        articleText,
        summary,
        row.link,
        row.source,
        row.category,
        new Date().toISOString(),
        insight || null
      ).run();

      await env.DB.prepare("DELETE FROM pending_articles WHERE id = ?").bind(row.id).run();
      processed++;
    } catch (e) {
      console.error(`[process] id=${row.id} 失败: ${e.message}`);
    }
  }

  return processed;
}
