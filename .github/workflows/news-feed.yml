name: 獲取新聞並發送至 Cloudflare D1
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

jobs:
  fetch-and-send:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch RSS, AI Optimize and POST to Cloudflare Worker
        env:
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen
          import xml.etree.ElementTree as ET

          categories = [
              ("時事", "國際 OR 世界"),
              ("科技動態", "科技"),
              ("焦點新聞", "熱門新聞"),
              ("金融", "金融 OR 財經"),
          ]

          def ai_optimize_article(title):
              api_key = os.environ.get("TOGETHER_API_KEY")
              if not api_key or len(api_key.strip()) < 10:
                  return title, ""

              url = "https://api.together.ai/v1/chat/completions"
              headers = {
                  "Authorization": f"Bearer {api_key.strip()}",
                  "Content-Type": "application/json",
                  "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"
              }
              payload = json.dumps({
                  "model": "deepseek-ai/DeepSeek-V3",
                  "messages": [
                      {
                          "role": "system",
                          "content": "你是一個專業的新聞網站主編。請根據提供的新聞原始標題，完成兩件事：1. 潤飾標題；2. 撰寫摘要。請嚴格返回 JSON 格式：{\"title\": \"...\", \"summary\": \"...\"}"
                      },
                      {
                          "role": "user",
                          "content": f"原始新聞標題: {title}"
                      }
                  ],
                  "response_format": {"type": "json_object"}
              }).encode("utf-8")

              try:
                  req = Request(url, data=payload, headers=headers, method="POST")
                  with urlopen(req, timeout=15) as resp:
                      res_json = json.loads(resp.read().decode("utf-8"))
                      content = res_json['choices'][0]['message']['content']
                      data = json.loads(content)
                      return data.get("title", title), data.get("summary", "")
              except Exception as e:
                  print(f"AI 優化失敗 ({title[:10]}...): {e}")
                  return title, ""

          def get_items(cat_name, query):
              urls = [
                  "https://news.google.com/rss/search?" + urlencode({"q": query, "hl": "zh-TW", "gl": "TW", "ceid": "TW:zh-Hant"}),
                  "https://www.bing.com/news/search?" + urlencode({"q": query, "format": "rss"})
              ]
              headers = {
                  "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36",
                  "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8"
              }

              for url in urls:
                  try:
                      req = Request(url, headers=headers)
                      with urlopen(req, timeout=15) as response:
                          content = response.read()
                          if content.strip().startswith(b"<!DOCTYPE") or content.strip().startswith(b"<html"):
                              continue
                          
                          root = ET.fromstring(content)
                          items = []
                          for item in root.findall("./channel/item")[:8]:
                              title = (item.findtext("title") or "").strip()
                              link = (item.findtext("link") or "").strip()
                              source_el = item.find("source")
                              source = source_el.text.strip() if source_el is not None and source_el.text else "網路新聞"
                              if title and link:
                                  opt_title, summary = ai_optimize_article(title)
                                  items.append({
                                      "title": opt_title,
                                      "link": link,
                                      "source": source,
                                      "summary": summary
                                  })
                          if items:
                              return items
                  except Exception as e:
                      continue
              return []

          all_news = {}
          for cat_name, query in categories:
              all_news[cat_name] = get_items(cat_name, query)
              time.sleep(1)

          # 測試正確的 Worker 網址（排除多餘的 sys 前綴）
          worker_urls = [
              "https://news-ingest.sylogs.workers.dev/api/news",
              "https://syslogs-news-ingest.sylogs.workers.dev/api/news",
              "https://sylogs.com/api/news"
          ]
          secret = os.environ.get("INGEST_SECRET")
          payload = json.dumps(all_news).encode("utf-8")

          for worker_url in worker_urls:
              req = Request(
                  worker_url,
                  data=payload,
                  method="POST",
                  headers={
                      "Content-Type": "application/json",
                      "Authorization": f"Bearer {secret}",
                      "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64)",
                  },
              )
              try:
                  with urlopen(req, timeout=30) as resp:
                      res_text = resp.read().decode("utf-8")
                      print(f"發送成功 [{worker_url}]:", res_text)
                      break
              except Exception as e:
                  print(f"嘗試 [{worker_url}] 失敗: {e}")
          PY
