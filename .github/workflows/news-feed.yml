name: 獲取新聞並發送至 Cloudflare D1
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

jobs:
  fetch-and-send:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch RSS and POST to Cloudflare Worker
        env:
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
        run: |
          pip install trafilatura --quiet
          python - <<'PY'
          import json
          import os
          import sys
          import time
          import re
          import html as html_lib
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError, URLError
          import xml.etree.ElementTree as ET
          import trafilatura

          categories = [
              ("時事", "國際"),
              ("科技動態", "科技"),
              ("焦點新聞", "熱門新聞"),
              ("金融", "金融"),
          ]

          def clean_html(raw):
              if not raw:
                  return ""
              raw = re.sub(r'<(script|style)[^>]*>.*?</\1>', ' ', raw, flags=re.DOTALL|re.IGNORECASE)
              raw = re.sub(r'<[^>]+>', ' ', raw)
              raw = html_lib.unescape(raw)
              raw = re.sub(r'\s+', ' ', raw).strip()
              return raw

          def fetch_rss(url):
              try:
                  req = Request(url, headers={"User-Agent": "Mozilla/5.0"})
                  with urlopen(req, timeout=15) as resp:
                      content = resp.read()
                      root = ET.fromstring(content)
                      items = []
                      for item in root.findall("./channel/item")[:10]:
                          title = (item.findtext("title") or "").strip()
                          link = (item.findtext("link") or "").strip()
                          source_el = item.find("source")
                          source = source_el.text.strip() if source_el is not None and source_el.text else "網絡新聞"
                          description = (item.findtext("description") or "").strip()
                          content_encoded = item.findtext("{http://purl.org/rss/1.0/modules/content/}encoded") or ""
                          raw_body = content_encoded or description
                          body_clean = clean_html(raw_body)
                          if title and link:
                              items.append({
                                  "title": title,
                                  "link": link,
                                  "source": source,
                                  "category": cat_name,
                                  "content": body_clean
                              })
                      return items
              except Exception:
                  return []

          def get_items(cat_name, query):
              # 先尝试 Bing
              bing_url = "https://www.bing.com/news/search?" + urlencode({"q": query, "format": "rss"})
              items = fetch_rss(bing_url)
              if items:
                  print(f"✅ {cat_name}: Bing 获取到 {len(items)} 篇")
                  return items
              # 如果 Bing 为空，尝试 Google
              google_url = "https://news.google.com/rss/search?" + urlencode({"q": query, "hl": "zh-TW", "gl": "TW", "ceid": "TW:zh-Hant"})
              items = fetch_rss(google_url)
              print(f"✅ {cat_name}: Google 获取到 {len(items)} 篇")
              return items

          def fetch_full_text(item):
              desc = item.get("content", "")
              if len(desc) >= 50:
                  return desc[:4000]
              # 尝试 trafilatura 提取
              link = item["link"]
              # 如果是 Bing/Google 跳转，尝试提取真实 URL
              try:
                  from urllib.parse import urlparse, parse_qs
                  parsed = urlparse(link)
                  qs = parse_qs(parsed.query)
                  if "url" in qs:
                      original = qs["url"][0]
                  else:
                      original = link
              except:
                  original = link
              try:
                  downloaded = trafilatura.fetch_url(original)
                  if downloaded:
                      text = trafilatura.extract(downloaded, include_comments=False, include_tables=False)
                      if text and len(text) >= 50:
                          return text[:4000]
              except Exception:
                  pass
              return ""

          all_articles = []
          for cat_name, query in categories:
              items = get_items(cat_name, query)
              for item in items:
                  full_text = fetch_full_text(item)
                  if full_text:
                      item["content"] = full_text
                      all_articles.append(item)
                  time.sleep(0.2)
              time.sleep(0.5)

          good = len(all_articles)
          print(f"📊 有效文章 {good} 篇")

          if not all_articles:
              print("❌ 没有有效文章")
              sys.exit(1)

          worker_url = "https://sylogs-news-fetcher.hjlaochi-27c.workers.dev/ingest"
          secret = os.environ.get("INGEST_SECRET", "").strip()
          if not secret:
              print("❌ 缺少 INGEST_SECRET")
              sys.exit(1)

          payload = json.dumps({"articles": all_articles}).encode("utf-8")
          req = Request(
              worker_url,
              data=payload,
              method="POST",
              headers={
                  "Content-Type": "application/json",
                  "Authorization": secret,
                  "x-admin-key": secret,
                  "User-Agent": "Mozilla/5.0",
              },
          )
          try:
              with urlopen(req, timeout=30) as resp:
                  res_text = resp.read().decode("utf-8")
                  print(f"✅ 發送成功: {res_text}")
          except HTTPError as e:
              print(f"❌ HTTP 错误: {e.code} {e.reason}")
              sys.exit(1)
          except URLError as e:
              print(f"❌ 网络错误: {e.reason}")
              sys.exit(1)
          PY
