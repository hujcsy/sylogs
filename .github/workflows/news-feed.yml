name: 獲取新聞並發送至 Cloudflare D1（完整正文版）

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

jobs:
  fetch-and-send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code (if needed)
        uses: actions/checkout@v3

      - name: Fetch RSS, extract full article, POST to Cloudflare Worker
        env:
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
        run: |
          pip install deep-translator beautifulsoup4 --quiet
          python - <<'PY'
          import json
          import os
          import sys
          import time
          import re
          import html as html_lib
          from urllib.parse import urlencode, urlparse, parse_qs, unquote
          from urllib.request import Request, urlopen, build_opener, HTTPRedirectHandler
          from urllib.error import HTTPError, URLError
          import xml.etree.ElementTree as ET
          from bs4 import BeautifulSoup
          from deep_translator import GoogleTranslator, MyMemoryTranslator

          categories = [
              ("時事", "world news"),
              ("科技動態", "technology"),
              ("焦點新聞", "top stories"),
              ("金融", "finance"),
              ("奇聞異事", "weird news"),
          ]

          class RedirectHandler(HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  newurl = newurl.replace(" ", "%20")
                  return super().redirect_request(req, fp, code, msg, headers, newurl)

          opener = build_opener(RedirectHandler)

          def clean_text(text):
              if not text:
                  return ""
              text = html_lib.unescape(text)
              text = re.sub(r'\s+', ' ', text).strip()
              return text

          def fetch_url(url, timeout=15):
              req = Request(url, headers={
                  "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36",
                  "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
                  "Accept-Language": "en-US,en;q=0.5",
              })
              with opener.open(req, timeout=timeout) as resp:
                  return resp.read().decode("utf-8", errors="ignore")

          def extract_main_text_bs(html_content):
              if not html_content:
                  return ""
              soup = BeautifulSoup(html_content, 'html.parser')
              for element in soup(["script", "style", "nav", "footer", "header", "aside", "form", "iframe", "noscript"]):
                  element.decompose()
              
              candidates = soup.find_all(['article', 'div'], class_=re.compile(r'article|story|post|content|text|body', re.I))
              best_text = ""
              for cand in candidates:
                  p_tags = cand.find_all('p')
                  text = " ".join([p.get_text() for p in p_tags])
                  if len(text) > len(best_text):
                      best_text = text

              if len(best_text) < 200:
                  p_tags = soup.find_all('p')
                  text = " ".join([p.get_text() for p in p_tags])
                  if len(text) > len(best_text):
                      best_text = text

              return clean_text(best_text)

          def resolve_url(link):
              target = link
              try:
                  if "bing.com/news/apiclick" in link:
                      q = parse_qs(urlparse(link).query)
                      if q.get("url"):
                          target = unquote(q["url"][0])
              except Exception:
                  pass
              return target

          def fetch_full_article(link):
              try:
                  target = resolve_url(link)
                  html = fetch_url(target)
                  return extract_main_text_bs(html)[:3000]
              except Exception:
                  return ""

          def fetch_rss(url, cat_name):
              try:
                  content = fetch_url(url)
                  root = ET.fromstring(content)
                  items = []
                  for item in root.findall("./channel/item")[:8]:
                      title = (item.findtext("title") or "").strip()
                      link = (item.findtext("link") or "").strip()
                      source_el = item.find("source")
                      source = source_el.text.strip() if source_el is not None and source_el.text else "News"
                      description = (item.findtext("description") or "").strip()
                      desc_clean = clean_text(re.sub(r'<[^>]+>', ' ', description))
                      if title and link:
                          items.append({
                              "title": title, "link": link, "source": source,
                              "category": cat_name, "content": desc_clean,
                          })
                  return items
              except Exception:
                  return []

          def translate_text(text, target_lang="zh-TW"):
              if not text or len(text) < 2: return text
              try:
                  return GoogleTranslator(source="auto", target=target_lang).translate(text[:1500])
              except:
                  try:
                      return MyMemoryTranslator(source="en", target=target_lang).translate(text[:1500])
                  except:
                      return text

          all_articles = []
          seen_links = set()
          print("🔄 開始獲取新聞...")

          for cat_name, query in categories:
              try:
                  items = fetch_rss("https://www.bing.com/news/search?" + urlencode({"q": query, "format": "rss", "mkt": "en-US"}), cat_name)
                  for item in items:
                      if item["link"] not in seen_links:
                          print(f"🌐 正在解析: {item['title'][:20]}...")
                          full = fetch_full_article(item["link"])
                          if len(full) > 50:
                              item["content"] = full
                          
                          if len(item["content"]) > 20:
                              item["title"] = translate_text(item["title"])
                              item["content"] = translate_text(item["content"])
                              all_articles.append(item)
                              seen_links.add(item["link"])
                              time.sleep(0.5)
              except Exception as e:
                  print(f"⚠️ 分類 {cat_name} 出錯: {e}")

          if not all_articles:
              print("❌ 沒有有效文章")
              sys.exit(1)

          worker_url = "https://sylogs-news-fetcher.hjlaochi-27c.workers.dev/ingest"
          secret = os.environ.get("INGEST_SECRET", "").strip()
          
          for i in range(0, len(all_articles), 5):
              batch = all_articles[i:i+5]
              payload = json.dumps({"articles": batch}).encode("utf-8")
              req = Request(worker_url, data=payload, method="POST", headers={
                  "Content-Type": "application/json",
                  "Authorization": secret,
                  "x-admin-key": secret,
                  "User-Agent": "Mozilla/5.0",
              })
              try:
                  with urlopen(req, timeout=30) as resp:
                      print(f"✅ 第 {i//5 + 1} 批次發送成功")
              except Exception as e:
                  print(f"❌ 發送失敗: {e}")
          PY
