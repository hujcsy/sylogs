name: 獲取新聞並發送至 Cloudflare D1
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

jobs:
  fetch-and-send:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch RSS and POST to Cloudflare Worker
        env:
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
        run: |
          pip install trafilatura --quiet
          python - <<'PY'
          import json
          import os
          import sys
          import time
          import re
          import html as html_lib
          from urllib.parse import urlencode, urlparse, parse_qs
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError, URLError
          import xml.etree.ElementTree as ET
          import trafilatura

          categories = [
              ("時事", "國際 OR 世界"),
              ("科技動態", "科技"),
              ("焦點新聞", "熱門新聞"),
              ("金融", "金融 OR 財經"),
          ]

          def clean_html(raw):
              if not raw:
                  return ""
              # 去掉 script/style
              raw = re.sub(r'<(script|style)[^>]*>.*?</\1>', ' ', raw, flags=re.DOTALL|re.IGNORECASE)
              # 去掉标签
              raw = re.sub(r'<[^>]+>', ' ', raw)
              # 解码 HTML 实体
              raw = html_lib.unescape(raw)
              # 合并空白
              raw = re.sub(r'\s+', ' ', raw).strip()
              return raw

          def fetch_rss(url):
              try:
                  req = Request(url, headers={"User-Agent": "Mozilla/5.0"})
                  with urlopen(req, timeout=15) as resp:
                      content = resp.read()
                      if content.strip().startswith(b"<!DOCTYPE") or content.strip().startswith(b"<html"):
                          return []
                      root = ET.fromstring(content)
                      items = []
                      for item in root.findall("./channel/item")[:8]:
                          title = (item.findtext("title") or "").strip()
                          link = (item.findtext("link") or "").strip()
                          source_el = item.find("source")
                          source = source_el.text.strip() if source_el is not None and source_el.text else "網絡新聞"
                          description = (item.findtext("description") or "").strip()
                          content_encoded = item.findtext("{http://purl.org/rss/1.0/modules/content/}encoded") or ""
                          # 优先取 content_encoded，否则 description
                          raw_body = content_encoded or description
                          body_clean = clean_html(raw_body)
                          if title and link:
                              items.append({
                                  "title": title,
                                  "link": link,
                                  "source": source,
                                  "category": cat_name,
                                  "content": body_clean  # 先存清洗后的描述
                              })
                      return items
              except Exception:
                  return []

          def get_items(cat_name, query):
              urls = [
                  "https://www.bing.com/news/search?" + urlencode({"q": query, "format": "rss"}),
                  "https://news.google.com/rss/search?" + urlencode({"q": query, "hl": "zh-TW", "gl": "TW", "ceid": "TW:zh-Hant"}),
              ]
              for url in urls:
                  items = fetch_rss(url)
                  if items:
                      print(f"✅ {cat_name}: 获取到 {len(items)} 篇")
                      return items
              return []

          def extract_real_url(link):
              if "news.google.com" in link:
                  try:
                      parsed = urlparse(link)
                      qs = parse_qs(parsed.query)
                      if "url" in qs:
                          return qs["url"][0]
                  except:
                      pass
              return link

          def is_noisy(text):
              # 检测是否包含导航/菜单等噪声
              noise_words = ["設首頁", "意見收集", "登入", "註冊", "手機版網頁", "專業報價服務",
                             "財經視頻", "最新影片", "投資教學", "地產家居", "貓達人", "收市有偈",
                             "午市博奕", "學市學菲", "直播時間表", "巿場動態", "即時期貨",
                             "公司通告", "活躍股票", "創新高/低股票", "公司派息", "簡", "EN"]
              for w in noise_words:
                  if w in text:
                      return True
              return False

          def fetch_full_text(item):
              # 如果 RSS 描述足够长（>100），直接使用
              desc = item.get("content", "")
              if len(desc) > 100:
                  return desc[:4000]
              # 否则尝试 trafilatura 提取
              link = item["link"]
              original = extract_real_url(link)
              try:
                  downloaded = trafilatura.fetch_url(original)
                  if downloaded:
                      text = trafilatura.extract(downloaded, include_comments=False, include_tables=False)
                      if text and len(text) > 200 and not is_noisy(text):
                          return text[:4000]
              except Exception:
                  pass
              return ""

          all_articles = []
          for cat_name, query in categories:
              items = get_items(cat_name, query)
              for item in items:
                  full_text = fetch_full_text(item)
                  if full_text:
                      item["content"] = full_text
                      all_articles.append(item)
                  time.sleep(0.2)
              time.sleep(0.5)

          good = len(all_articles)
          print(f"📊 有效文章 {good} 篇")

          if not all_articles:
              print("❌ 没有有效文章")
              sys.exit(1)

          worker_url = "https://sylogs-news-fetcher.hjlaochi-27c.workers.dev/ingest"
          secret = os.environ.get("INGEST_SECRET", "").strip()
          if not secret:
              print("❌ 缺少 INGEST_SECRET")
              sys.exit(1)

          payload = json.dumps({"articles": all_articles}).encode("utf-8")
          req = Request(
              worker_url,
              data=payload,
              method="POST",
              headers={
                  "Content-Type": "application/json",
                  "Authorization": secret,
                  "x-admin-key": secret,
                  "User-Agent": "Mozilla/5.0",
              },
          )
          try:
              with urlopen(req, timeout=30) as resp:
                  res_text = resp.read().decode("utf-8")
                  print(f"✅ 發送成功: {res_text}")
          except HTTPError as e:
              print(f"❌ HTTP 错误: {e.code} {e.reason}")
              sys.exit(1)
          except URLError as e:
              print(f"❌ 网络错误: {e.reason}")
              sys.exit(1)
          PY
